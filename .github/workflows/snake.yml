name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
              dist/snake-light.svg?color_snake=#7c3aed&color_dots=#e4e7eb,#9be9a8,#40c463,#30a14e,#216e39
              dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#2d333b,#0e4429,#006d32,#26a641,#39d353

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
